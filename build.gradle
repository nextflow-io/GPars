publishing {
    repositories {
        maven {
            name = "SeqeraRepository"
            url = project.findProperty('publish_repo_url') ?: System.getenv('PUBLISH_REPO_URL') ?: "s3://maven.seqera.io/snapshots"
            credentials(AwsCredentials) {
                accessKey = System.env.AWS_ACCESS_KEY_ID ?: project.findProperty('aws_access_key_id')
                secretKey = System.env.AWS_SECRET_ACCESS_KEY ?: project.findProperty('aws_secret_access_key')
                sessionToken = System.env.AWS_SESSION_TOKEN ?: project.findProperty('aws_session_token')
            }
        }
    }

    publications {
        gParsPublish(MavenPublication) {
            artifactId 'gpars'
            from components.java
            pom {
                name = 'GPars'
                description ='The Groovy and Java high-level concurrency library offering actors, dataflow, CSP, agents, parallel collections, fork/join and more'
                url = 'http://gpars.codehaus.org'
                inceptionYear = '2009'
                licenses {
                    license {
                        name = 'The Apache Software License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        distribution = 'repo'
                    }
                }
            }
            pom.withXml {
                asNode().dependencies.dependency.each { xmlDep ->
                    println(xmlDep.artifactId.text())
                    if (xmlDep.artifactId.text() in ['netty', 'jcsp', 'multiverse', 'groovy-all']) {
                        // mark optional dependencies
                        def xmlOptional = xmlDep.optional[0];
                        if (!xmlOptional) {
                            xmlOptional = xmlDep.appendNode('optional')
                        }
                        xmlOptional.value = 'true';
                    }
                }
            }
            artifact zipDoc {
                archiveClassifier = 'javadoc'
            }
            artifact zipSrc {
                archiveClassifier = 'sources'
            }
        }
    }
}
